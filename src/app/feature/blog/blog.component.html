<section class="blog-container">
  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  } @else {
    @if (blogs().length === 0) {
      <p class="empty">Keine Blogeinträge gefunden.</p>
    } @else {
      <div class="blog-list">
        @for (blog of blogs(); track blog.id) {
          <mat-card
            class="blog-card"
            appearance="outlined"
            [routerLink]="['/blog', blog.id]"
            (click)="sendData()"
          >
            <img
              mat-card-image
              src="https://images.pexels.com/photos/267389/pexels-photo-267389.jpeg"
              alt="Blog image"
            />
            <mat-card-header>
              <mat-card-title>{{ blog.title }}</mat-card-title>
              <mat-card-subtitle
                >Autor: {{ blog.author }} –
                {{ blog.createdAt | date: "mediumDate" }}</mat-card-subtitle
              >
            </mat-card-header>
            <mat-card-content>
              <p>{{ blog.contentPreview }}</p>
            </mat-card-content>
            <mat-card-actions>
              <button mat-button>👍 {{ blog.likes }}</button>
              <button mat-button>💬 {{ blog.comments }}</button>
            </mat-card-actions>
          </mat-card>
        }
      </div>
    }
  }
</section>
