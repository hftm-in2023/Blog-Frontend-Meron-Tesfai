<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ blog?.title }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <h4>Author: {{ blog?.author }}</h4>
    <section>
      {{ blog?.contentPreview }}
    </section>
    <section>
      <p>
        Likes:{{ blog?.likes }} {{ "detailsComponent.comments" | translate }}
        {{ blog?.comments }}
      </p>
      <p>
        {{ "detailsComponent.createdAt" | translate }}
        {{ blog?.createdAt | date }}
      </p>
    </section>
  </mat-card-content>
</mat-card>
