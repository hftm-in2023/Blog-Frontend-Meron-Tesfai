<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  >
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/">Home</a>
      <a mat-list-item routerLink="/blog">Blogs</a>

      @if (isAuthenticated()) {
        <a mat-list-item routerLink="/add-blog">{{
          "sidbar.addBlogButton" | translate
        }}</a>

        <button mat-list-item (click)="logout()">
          {{ "sidbar.logoutButton" | translate }}
        </button>
      } @else {
        <button mat-list-item (click)="login()">
          {{ "sidbar.loginButton" | translate }}
        </button>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isHandset$ | async) {
        <button
          type="button"
          aria-label="Toggle sidenav"
          matIconButton
          (click)="drawer.toggle()"
        >
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <div class="lang-switch">
        <button mat-button (click)="setLangToGerman()">
          <span>DE</span>
        </button>
        <button mat-button (click)="setLangToEnglish()">
          <span>EN</span>
        </button>
      </div>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
